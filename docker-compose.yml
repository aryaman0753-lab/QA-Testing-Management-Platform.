services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qahub}
      POSTGRES_USER: ${POSTGRES_USER:-qahub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qahub_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - qahub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qahub} -d ${POSTGRES_DB:-qahub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-qahub}:${POSTGRES_PASSWORD:-qahub_dev_password}@db:5432/${POSTGRES_DB:-qahub}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-replace-with-a-long-random-secret}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      ATTACHMENT_STORAGE_DIR: ${ATTACHMENT_STORAGE_DIR:-/app/storage/attachments}
      MAX_ATTACHMENT_SIZE_MB: ${MAX_ATTACHMENT_SIZE_MB:-10}
      API_REQUEST_TIMEOUT_SECONDS: ${API_REQUEST_TIMEOUT_SECONDS:-30}
      API_MAX_TIMEOUT_SECONDS: ${API_MAX_TIMEOUT_SECONDS:-60}
      API_MAX_RESPONSE_SIZE_MB: ${API_MAX_RESPONSE_SIZE_MB:-5}
      API_RESPONSE_BODY_RETENTION_BYTES: ${API_RESPONSE_BODY_RETENTION_BYTES:-262144}
      API_MAX_REDIRECTS: ${API_MAX_REDIRECTS:-5}
      API_EXECUTIONS_PER_MINUTE: ${API_EXECUTIONS_PER_MINUTE:-30}
      API_ALLOW_PRIVATE_NETWORKS: ${API_ALLOW_PRIVATE_NETWORKS:-false}
      API_ALLOW_INSECURE_SSL: ${API_ALLOW_INSECURE_SSL:-false}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-}
      LOAD_TEST_MAX_USERS: ${LOAD_TEST_MAX_USERS:-100}
      LOAD_TEST_MAX_DURATION_SECONDS: ${LOAD_TEST_MAX_DURATION_SECONDS:-600}
      LOAD_TEST_MAX_SPAWN_RATE: ${LOAD_TEST_MAX_SPAWN_RATE:-20}
      LOAD_TEST_MAX_TARGET_RPS: ${LOAD_TEST_MAX_TARGET_RPS:-500}
      LOAD_TEST_MAX_CONCURRENT_PER_USER: ${LOAD_TEST_MAX_CONCURRENT_PER_USER:-1}
      LOAD_TEST_MAX_CONCURRENT_PER_PROJECT: ${LOAD_TEST_MAX_CONCURRENT_PER_PROJECT:-2}
      LOAD_TEST_MAX_CONCURRENT_RUNS: ${LOAD_TEST_MAX_CONCURRENT_RUNS:-3}
      LOAD_TEST_MAX_RESPONSE_SIZE_BYTES: ${LOAD_TEST_MAX_RESPONSE_SIZE_BYTES:-1048576}
      LOAD_TEST_ALLOW_PRIVATE_NETWORKS: ${LOAD_TEST_ALLOW_PRIVATE_NETWORKS:-false}
      LOAD_TEST_ALLOW_PRODUCTION: ${LOAD_TEST_ALLOW_PRODUCTION:-false}
      LOAD_TEST_PRODUCTION_MAX_USERS: ${LOAD_TEST_PRODUCTION_MAX_USERS:-10}
      LOAD_TEST_PRODUCTION_MAX_DURATION_SECONDS: ${LOAD_TEST_PRODUCTION_MAX_DURATION_SECONDS:-60}
      LOAD_TEST_PRODUCTION_MAX_TARGET_RPS: ${LOAD_TEST_PRODUCTION_MAX_TARGET_RPS:-20}
      LOAD_TEST_REQUIRE_ALLOWLIST: ${LOAD_TEST_REQUIRE_ALLOWLIST:-true}
      LOAD_TEST_ALLOWED_HOSTS: ${LOAD_TEST_ALLOWED_HOSTS:-}
      LOAD_TEST_RESULT_RETENTION_DAYS: ${LOAD_TEST_RESULT_RETENTION_DAYS:-30}
      LOAD_TEST_METRICS_INTERVAL_SECONDS: ${LOAD_TEST_METRICS_INTERVAL_SECONDS:-2}
      LOAD_TEST_STALE_RUN_SECONDS: ${LOAD_TEST_STALE_RUN_SECONDS:-90}
      LOAD_TEST_QUEUE_NAME: ${LOAD_TEST_QUEUE_NAME:-qahub:load-tests}
    ports:
      - "8000:8000"
    volumes:
      - qahub_attachment_data:/app/storage/attachments
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  load-worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["python", "-m", "workers.load_testing.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-qahub}:${POSTGRES_PASSWORD:-qahub_dev_password}@db:5432/${POSTGRES_DB:-qahub}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-replace-with-a-long-random-secret}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-}
      LOAD_TEST_MAX_USERS: ${LOAD_TEST_MAX_USERS:-100}
      LOAD_TEST_MAX_DURATION_SECONDS: ${LOAD_TEST_MAX_DURATION_SECONDS:-600}
      LOAD_TEST_MAX_SPAWN_RATE: ${LOAD_TEST_MAX_SPAWN_RATE:-20}
      LOAD_TEST_MAX_TARGET_RPS: ${LOAD_TEST_MAX_TARGET_RPS:-500}
      LOAD_TEST_MAX_RESPONSE_SIZE_BYTES: ${LOAD_TEST_MAX_RESPONSE_SIZE_BYTES:-1048576}
      LOAD_TEST_ALLOW_PRIVATE_NETWORKS: ${LOAD_TEST_ALLOW_PRIVATE_NETWORKS:-false}
      LOAD_TEST_ALLOW_PRODUCTION: ${LOAD_TEST_ALLOW_PRODUCTION:-false}
      LOAD_TEST_PRODUCTION_MAX_USERS: ${LOAD_TEST_PRODUCTION_MAX_USERS:-10}
      LOAD_TEST_PRODUCTION_MAX_DURATION_SECONDS: ${LOAD_TEST_PRODUCTION_MAX_DURATION_SECONDS:-60}
      LOAD_TEST_PRODUCTION_MAX_TARGET_RPS: ${LOAD_TEST_PRODUCTION_MAX_TARGET_RPS:-20}
      LOAD_TEST_REQUIRE_ALLOWLIST: ${LOAD_TEST_REQUIRE_ALLOWLIST:-true}
      LOAD_TEST_ALLOWED_HOSTS: ${LOAD_TEST_ALLOWED_HOSTS:-}
      LOAD_TEST_METRICS_INTERVAL_SECONDS: ${LOAD_TEST_METRICS_INTERVAL_SECONDS:-2}
      LOAD_TEST_QUEUE_NAME: ${LOAD_TEST_QUEUE_NAME:-qahub:load-tests}
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    cpus: "1.0"
    mem_limit: 1g

volumes:
  qahub_postgres_data:
  qahub_attachment_data:
