[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qahub-cli"
version = "0.6.0"
description = "QAHub CI/CD command-line client"
requires-python = ">=3.11"

[project.scripts]
qahub = "qahub_cli.cli:main"

[tool.setuptools]
packages = ["qahub_cli"]
