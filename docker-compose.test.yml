services:
  backend-tests:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    command: ["python", "-m", "pytest", "-q"]
    environment:
      DATABASE_URL: sqlite:////tmp/qahub-tests.db
      JWT_SECRET_KEY: test-only-secret
      SECRET_ENCRYPTION_KEY: test-only-encryption-key
      ENVIRONMENT: test
    volumes:
      - ./backend:/app

  frontend-tests:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "npm ci && npm test -- --run"]
    volumes:
      - ./frontend:/app
      - frontend_test_modules:/app/node_modules

volumes:
  frontend_test_modules:
