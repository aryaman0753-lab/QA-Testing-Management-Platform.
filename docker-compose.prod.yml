x-runtime: &runtime
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?set POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY}
  SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?set SECRET_ENCRYPTION_KEY}
  ENVIRONMENT: production
  DEBUG: "false"
  CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL}
  AUTOMATION_ALLOW_PRODUCTION: ${AUTOMATION_ALLOW_PRODUCTION:-false}
  LOAD_TEST_ALLOW_PRODUCTION: ${LOAD_TEST_ALLOW_PRODUCTION:-false}
  AUTOMATION_ALLOWED_HOSTS: ${AUTOMATION_ALLOWED_HOSTS:-}
  LOAD_TEST_ALLOWED_HOSTS: ${LOAD_TEST_ALLOWED_HOSTS:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  WEBHOOK_DELIVERY_RETENTION_DAYS: ${WEBHOOK_DELIVERY_RETENTION_DAYS:?set WEBHOOK_DELIVERY_RETENTION_DAYS}
  AUTOMATION_RESULT_RETENTION_DAYS: ${AUTOMATION_RESULT_RETENTION_DAYS:?set AUTOMATION_RESULT_RETENTION_DAYS}
  LOAD_TEST_RESULT_RETENTION_DAYS: ${LOAD_TEST_RESULT_RETENTION_DAYS:?set LOAD_TEST_RESULT_RETENTION_DAYS}

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [qahub_prod_db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [qahub_prod_redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: *runtime
    depends_on:
      db: { condition: service_healthy }

  backend:
    build: ./backend
    restart: always
    environment: *runtime
    ports: ["127.0.0.1:8000:8000"]
    volumes: [qahub_prod_attachments:/app/storage/attachments]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args: { VITE_API_BASE_URL: "${VITE_API_BASE_URL:?set VITE_API_BASE_URL}" }
    restart: always
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      backend: { condition: service_healthy }

  automation-worker: &worker
    build: ./backend
    restart: always
    command: ["python", "-m", "workers.automation.worker"]
    environment: *runtime
    depends_on:
      backend: { condition: service_healthy }

  scheduler-worker:
    <<: *worker
    command: ["python", "-m", "workers.automation.scheduler"]

  load-worker:
    <<: *worker
    command: ["python", "-m", "workers.load_testing.worker"]

  operations-worker:
    <<: *worker
    command: ["python", "-m", "workers.operations.worker"]

volumes:
  qahub_prod_db:
  qahub_prod_redis:
  qahub_prod_attachments:
